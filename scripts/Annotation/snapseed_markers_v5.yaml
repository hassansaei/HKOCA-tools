# Kidney organoid cell types and markers v5

Nephron:
  marker_genes: [PAX2, PAX8, EPCAM]
  subtypes:
    Nephron_progenitor_cells:
      marker_genes: [PAX2, LYPD1]
    Podocytes:
      marker_genes: [NPHS1, NPHS2, PODXL]
      subtypes:
        Precursor_podocytes:
          marker_genes: [OLFM3, MAFB]
        Mature_podocytes:
          marker_genes: [DDN, PTPRO]
    Proximal_tubule:
      marker_genes: [CUBN, LRP2]
      subtypes:
        Dev_PT:
          marker_genes: [SLC27A2, CDH6]
        PT:
          marker_genes: [SLC34A1, SLC6A19]
    PEC-like:
      marker_genes: [CLDN1, KRT8, KRT18, PAX8]
    LOH:
      marker_genes: [SLC12A1, UMOD, POU3F3, IRX1]
    Distal_tubule:
      marker_genes: [CALB1, MAL]
    Proliferative_tubule:
      marker_genes: [UBE2C, MKI67, TOP2A, KRT8, KRT18]
Ureteric_Epithelium:
  marker_genes: [SLC26A7, AQP2, RET, WFDC2]
  subtypes:
    Collecting_duct:
      marker_genes: [AQP2, SLC26A7, GATA3]
Stromal_cells:
  marker_genes: [COL14A1, COL1A1, COL2A1, PDGFRA, PDGFRB]
  subtypes:
    Proliferative_stroma:
      marker_genes: [UBE2C, MKI67, TOP2A]
    S1:
      marker_genes: [TAGLN, ACTA2, DES]
    S2:
      marker_genes: [EBF3, PRRX1, ZFHX4]
    S3:
      marker_genes: [COL9A3, ACAN, CNMD]
Endothelial_cells:
  marker_genes: [PECAM1, KDR, CAV1]
Off_target_cells:
  marker_genes: [HES6, STMN2, MYOG, FABP7, SRGN, PTPRC, OTX2, CDX2, TUBB3, MYOD1, MYL1]
  subtypes:
    Neural_progenitor_cells:
      marker_genes: [HES6, STMN2, OTX2, TUBB3]
    Muscle_progenitor_cells:
      marker_genes: [MYOG, MYOD1, TTN, MYL1, PITX2]
    Glial_cells:
      marker_genes: [FABP7, TTYH1, SOX2, FRZB, MSX1]
    Endodermal_cells:
      marker_genes: [CDX2, SI, CDH17, AGR2, APOA1, TTR, FABP1, GSTA1, SHH]
undifferentiated_pluripotent_cells:
  marker_genes: [L1TD1, POU5F1, USP44]

