name: organoid_vs_primary
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy>=1.14,<1.18
  - h5py>=3.10
  - matplotlib>=3.8
  - seaborn=0.13.2
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - networkx>=3.2
  - tqdm
  - joblib
  - numba
  - pillow

  # Single-cell
  - scanpy=1.10.4
  - anndata>=0.10
  - umap-learn>=0.5.5
  - pynndescent>=0.5.11
  - python-igraph
  - leidenalg

  # R + edgeR (called from deg_edger_protocols.py)
  - r-base=4.3.1
  - bioconductor-edger=4.0.16
  - bioconductor-limma=3.58.1
  - r-jsonlite
  - r-matrix

  - pip:
      # Often newer / more reliable from PyPI in this stack
      - gseapy==1.3.1
      - harmonypy==2.0.0
      - obonet==1.1.1
