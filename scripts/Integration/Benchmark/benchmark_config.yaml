# HKOCA Integration Benchmark - central configuration
# Override at runtime with: export BENCHMARK_CONFIG=/path/to/benchmark_config.yaml

paths:
  scripts_dir: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/scripts_benchmark/push
  master_atlas: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/annotation/simple/annotation/after_harmonization/unintegrated_organoid_atlas_important_columns.h5ad
  checkpoints_dir: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/scripts_benchmark/push/checkpoints
  log_dir: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/scripts_benchmark/push/logs
  conda_profile: /data-master/pure-workspace/hmami/miniconda3/etc/profile.d/conda.sh
  conda_env: atlas

iteration:
  n_iterations: 10
  samples_per_iteration: 10
  subsample_seed: 42
  default_iter_id: 1
  slurm_env_var: SLURM_ARRAY_TASK_ID
  checkpoint_subdir_pattern: subsample_iter_{iter_id}

metadata:
  batch_key: sample_id
  label_key: Level_3_latest
  counts_layer: counts

subsample:
  hvg_flavor: seurat_v3
  n_top_genes: 3000

integration:
  random_state: 42
  n_pcs: 50
  n_neighbors: 15
  scale_max_value: 10
  pca_svd_solver: arpack
  checkpoint_compression: gzip

  harmony:
    max_iter_harmony: 30
    max_iter_kmeans: 20

  scanorama:
    dimred: 50

  scvi:
    n_latent: 30
    n_layers: 2
    n_hidden: 256
    dropout_rate: 0.1
    dispersion: gene
    gene_likelihood: nb
    latent_distribution: normal
    max_epochs: 200
    batch_size: 2048
    early_stopping_patience: 15
    model_dir: scvi_model

  scanvi:
    unlabeled_category: Unknown
    max_epochs: 200
    batch_size: 2048
    early_stopping_patience: 15

  scpoli:
    latent_dim: 30
    embedding_dims: 10
    recon_loss: nb
    n_epochs: 100
    pretraining_epochs: 80
    eta: 10
    alpha_epoch_anneal: 100
    early_stopping_metric: val_loss
    early_stopping_mode: min
    early_stopping_threshold: 0
    early_stopping_patience: 20
    reduce_lr: true
    lr_patience: 13
    lr_factor: 0.1

r_integration:
  seurat_dims: 30
  seurat_npcs: 50
  css_label_tag: sample_id
  embedding_files:
    cca: cca_embeddings.csv
    rpca: rpca_embeddings.csv
    css_pearson: css_pearson_embeddings.csv
    css_spearman: css_spearman_embeddings.csv

export:
  mtx_counts: heoca_counts.mtx
  mtx_metadata: heoca_metadata.csv
  mtx_genes: heoca_genes.csv

metrics:
  bio_weight: 0.6
  batch_weight: 0.4
  bio_keys:
    - ARI
    - NMI
    - ASW_celltype
    - iso_label_F1
    - iso_label_ASW
    - cLISI
  batch_keys:
    - ASW_batch
    - graph_connectivity
    - iLISI
    - kBET
    - PCR
  methods:
    - pca
    - cca
    - rpca
    - scvi
    - scanvi
    - scpoli
    - bbknn
    - harmony
    - combat
    - scanorama
    - css_pearson
    - css_spearman
  embed_key: X_emb
  cluster_key: leiden_scib
  reference_checkpoint: checkpoint_pca.h5ad
  pcr_n_comps: 8
  pcr_scale: true
  lisi_k0: 90
  lisi_subsample: 100
  lisi_scale: true
  seed_offset: 42
  output_file: scib_raw_metrics_full.csv

visualization:
  n_iterations: 10
  mean_metrics_file: scib_mean_metrics.csv
  std_metrics_file: scib_std_metrics.csv
  heatmap_file: scib_mean_sd_heatmap.png
  errorbars_file: scib_overall_errorbars.png
  scorecard_file: MASTER_SCORECARD.png
  heatmap_dpi: 150
  errorbars_dpi: 150
  scorecard_dpi: 200
  heatmap_figsize: [24, 7]
  errorbars_figsize: [11, 5]
  scorecard_figsize: [26, 9]
  scorecard_width_ratios: [6, 5, 2, 1.2]
  baseline_method: pca
