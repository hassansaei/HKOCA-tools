# HKOCA Level_2 integration benchmark settings.
# Toggle any method with true/false. Disabled methods are skipped (not scored).

paths:
  # Absolute path to the clean annotated atlas
  master_h5ad: /data-master/pure-workspace/labss/hmami/atlas_shortcut_new_start/annotated_leiden_res2.0_clean.h5ad
  python: /data-master/pure-workspace/hmami/conda_envs/atlas/bin/python
  rscript: Rscript

benchmark:
  n_iters: 10
  subsample_seed: 42
  random_state: 42
  n_top_hvg: 3000
  batch_key: sample_id
  label_key: Level_2

# Enable / disable individual methods
methods:
  pca: true
  harmony: true
  scanorama: true
  combat: true
  bbknn: true
  scvi: true
  scanvi: true
  scpoli: true
  seurat_v3: true
  seurat_v4: true
  css_pearson: true
  css_spearman: true
