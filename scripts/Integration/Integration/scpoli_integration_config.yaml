# scPoli integration settings for the HKOCA organoid atlas.

paths:
  output_dir: /data-master/pure-workspace/labss/hmami/atlas_shortcut/integration_scpoli_leiden_res2.0_clean
  annotated_h5ad: /data-master/pure-workspace/labss/hmami/atlas_shortcut/integration_scpoli_leiden_res2.0_clean/objects/annotated_leiden_res2.0_clean.h5ad
  output_h5ad: scpoli_integrated_leiden_res2.0_clean.h5ad
  model_dir: models/scPoli_Reference_Model_leiden_res2.0_clean
  checkpoint_pretrain_dir: models/scPoli_Reference_Model_leiden_res2.0_clean_after_pretrain

metadata:
  sanitize_keys:
    - study
    - sample_id
    - Level_2
    - Level_1
  label_keys:
    - Level_1
    - Level_2
    - Level_3
    - leiden_scpoli_res2.0

feature_selection:
  n_top_genes: 4000
  hvg_flavor: seurat_v3
  batch_key: study

pca:
  n_comps: 30
  n_neighbors: 15
  random_state: 99
  min_dist: 0.8
  spread: 1.0
  normalize_target_sum: 10000

scpoli:
  condition_keys:
    - study
    - sample_id
  cell_type_key: Level_2
  hidden_layer_sizes: [128, 128, 128]
  latent_dim: 30
  embedding_dims: 20
  recon_loss: nb

training:
  n_epochs: 100
  pretraining_epochs: 80
  eta: 1.0
  alpha_epoch_anneal: 100
  batch_size: 2048
  early_stopping_metric: val_loss
  patience: 10
  threshold: 0
  reduce_lr: true
  lr_patience: 5
  lr_factor: 0.1

plotting:
  figsize: [12, 12]
  dpi: 300
  comparison_figsize: [28, 11]
  point_size: 1.5
  point_alpha: 1.0
  title_fontsize: 18
  label_fontsize: 14
  tick_fontsize: 12
  legend_fontsize: 11
  level_1_colors:
    Nephron: "#0072B2"
    Ureteric_Epithelium: "#6A51A3"
    Stromal_cells: "#D55E00"
    Endothelial_cells: "#009E73"
    Off_target_cells: "#737373"
    undifferentiated_pluripotent_cells: "#F0E442"
