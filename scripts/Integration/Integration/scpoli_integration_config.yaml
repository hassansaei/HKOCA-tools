# scPoli full-atlas integration configuration
# Usage: python run_integration_scpoli_parameters.py --config scpoli_integration_config.yaml

paths:
  output_dir: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters
  baseline_h5ad: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/annotation/simple/annotation/after_harmonization/unintegrated_organoid_atlas_important_columns.h5ad
  output_h5ad: Master_Atlas_scPoli_Level2_Integrated_parameters.h5ad

metadata:
  sanitize_keys:
    - study
    - sample_id
    - Level_2
    - Level_1

feature_selection:
  n_top_genes: 4000
  hvg_flavor: seurat_v3
  batch_key: study

pca:
  n_comps: 30
  n_neighbors: 15
  random_state: 42
  normalize_target_sum: 10000

scpoli:
  condition_keys:
    - study
    - sample_id
  cell_type_key: Level_2
  hidden_layer_sizes: [128, 128, 128]
  latent_dim: 30
  embedding_dims: 20
  recon_loss: nb

training:
  n_epochs: 100
  pretraining_epochs: 80
  eta: 1.0
  alpha_epoch_anneal: 100
  batch_size: 2048
  early_stopping_metric: val_loss
  patience: 10
  threshold: 0
  reduce_lr: true
  lr_patience: 5
  lr_factor: 0.1

plotting:
  figsize: [12, 12]
  dpi: 300
  comparison_figsize: [26, 10]
  level_1_colors:
    - "#E41A1C"
    - "#FFFF33"
    - "#4DAF4A"
    - "#377EB8"
    - "#000000"
