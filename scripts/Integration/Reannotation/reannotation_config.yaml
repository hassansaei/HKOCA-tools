# Level 3 reannotation at Leiden resolution 10
# Usage: python reannotate_res10.py --config reannotation_config.yaml

paths:
  input_h5ad: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/Master_Atlas_scPoli_Level2_Integrated_parameters.h5ad
  output_h5ad: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/Master_Atlas_scPoli_Integrated_Reannotated.h5ad
  figure_dir: /data-master/pure-workspace/labss/hmami/new_data/HKOCA-tools/scripts/Integration/test_level2_celltype/parameters/reannotation/figures

clustering:
  use_rep: X_emb
  n_neighbors: 30
  random_state: 42
  resolution: 10.0
  leiden_key: leiden_res_10

annotation:
  source_level3: Level_3_latest
  source_level2: Level_2
  source_level1: Level_1
  output_level3: Level_3_Integrated
  output_level2: Level_2_Integrated
  output_level1: Level_1_Integrated

marker_refinement:
  n_subset: 100000
  random_state: 42
  groupby: Level_3_Integrated
  method: wilcoxon
  n_top_genes: 10
  use_raw: false
  pts: true

plotting:
  dpi: 300
  facecolor: white
  cmap: Blues
  standard_scale: var
  title: Top 10 Marker Genes Hierarchical Clustering
  matrixplot_filename: Hierarchical_Marker_Genes_Refinement.png
