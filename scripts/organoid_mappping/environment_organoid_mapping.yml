name: organoid-mapping
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - scanpy>=1.10
  - anndata
  - pandas
  - numpy
  - pyyaml
  - scikit-learn
  - python-igraph      # required by scanpy's leiden flavor="igraph"
  - leidenalg          # Leiden clustering backend
  - python-louvain     # Louvain clustering backend (only if clustering.algorithm: "louvain")
  - h5py               # h5ad I/O backend used by scanpy
