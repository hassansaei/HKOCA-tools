# Default Snapseed annotation config for hkoca annotation.
# Packaged defaults live under hkoca/config/ (markers + celltype_colors.yaml).
# Paths may be absolute or relative to --working-dir / the config file directory.

paths:
  # Input: one h5ad, a directory of h5ad files, or a glob (CLI --input overrides).
  input: null
  # Marker hierarchy YAML (default: hkoca/config/snapseed_markers_v4.yaml).
  markers: null
  # Root output directory.
  output_dir: annotation_results
  annotated_subdir: annotated_obj
  clustered_subdir: clustered
  figures_subdir: figures

parameters:
  seed: 42
  scanpy_verbosity: 1
  # Leiden resolutions used for Snapseed (run all by default).
  resolutions: [0.4, 0.6, 1.0]
  hvg_n_top_genes: 3000
  pca_n_comps: 50
  neighbors_n_neighbors: 20
  neighbors_n_pcs: 30
  scale_max_value: 10
  normalize_target_sum: 10000
  # Write UMAP / assignment PNGs when true (default on; disable with --no-save-plots).
  save_plots: true
  dpi: 150
  # Skip samples that already have matching annotated outputs.
  skip_existing: true
