# Default HKOCA atlas projection config (scPoli surgery).
# CLI flags override these values.
#
# Overlay keeps the atlas UMAP frozen (X_umap_scpoli). Query cells are placed
# on it by kNN after encoding an atlas subsample with the same query surgery
# model (not stored atlas X_emb). --model-dir must be the reference model
# trained for this atlas (same var_names and condition keys, typically
# study + sample_id).

paths:
  atlas_h5ad: null
  query: null
  model_dir: null
  output_dir: projection_results

query:
  batch_key: sample_id
  label_column: null
  counts_layer: counts

reference:
  celltype_key: Level_3_Integrated
  condition_key: sample_id
  unknown_label: Unknown
  atlas_umap_key: X_umap_scpoli
  atlas_latent_key: X_emb

scpoli:
  n_epochs: 50
  pretrain_epochs: 40
  eta: 10
  seed: 42

outputs:
  projected_subdir: projected_obj
  figures_subdir: figures
  tables_subdir: tables
  logs_subdir: logs
  models_subdir: models

plotting:
  save_plots: true
  dpi: 150
  skip_existing: true
  joint_umap: false
  atlas_umap_subsample: 80000
  knn_neighbors: 30
  atlas_bg_max: 120000
  min_mean_similarity: 0.01
