# GPU required for scPoli surgery. CPU is possible but very slow.
# Scientific stack is conda-forge only. GPU PyTorch is installed from
# pip CUDA 12.4 wheels so mamba is not forced to mix the pytorch channel
# (strict priority blocks igraph / libjpeg-turbo and matplotlib then
# tries Qt/PySide).
name: hkoca_projection
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - anndata
  - scanpy
  - scipy
  - numpy
  - pandas
  - matplotlib-base
  - scikit-learn
  - h5py
  - pyyaml
  - leidenalg
  - python-igraph
  - pip:
      - --extra-index-url=https://download.pytorch.org/whl/cu124
      - torch
      - scarches==0.6.1
