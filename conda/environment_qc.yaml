name: sc_qc_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Base languages
  - python=3.10
  - r-base>=4.2.0

  # Python dependencies (required by reticulate/anndata H5AD export)
  - anndata
  - h5py
  - numpy
  - pandas
  - scipy

  # R CRAN packages
  - r-seurat>=4.3.0
  - r-seuratobject
  - r-matrix
  - r-mass
  - r-ggplot2
  - r-patchwork
  - r-cowplot
  - r-scales
  - r-reshape2
  - r-ggridges
  - r-ggrepel
  - r-ggrastr
  - r-yaml
  - r-dplyr
  - r-jsonlite
  - r-digest
  - r-reticulate
  - r-anndata

  # R Bioconductor packages
  - bioconductor-singlecellexperiment
  - bioconductor-scdblfinder
